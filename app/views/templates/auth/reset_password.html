<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - ALO Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-login { max-width: 400px; margin: 80px auto; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .btn-warning { background-color: #FFD400; border: none; font-weight: bold; }
        .btn-warning:hover { background-color: #e6be00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-login">
            <div class="card-header bg-dark text-white text-center py-3" style="border-radius: 10px 10px 0 0;">
                <h4 class="mb-0 text-warning">ALO Service</h4>
            </div>
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-3">Crear Nueva Contraseña</h5>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show text-center small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Nueva Contraseña</label>
                        <input type="password" name="nueva_password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Confirmar Contraseña</label>
                        <input type="password" name="confirmar_password" class="form-control" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-warning w-100 mt-2">Actualizar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
